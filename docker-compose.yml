services:
  # ── Relational Database ──
  db:
    image: postgres:15-alpine
    container_name: trinetra-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=trinetra
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: trinetra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Message Broker ──
  redis:
    image: redis:alpine
    container_name: trinetra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── API Orchestrator (Backend) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - VECTORAI_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/trinetra
      - STORAGE_MODE=edge
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend:80
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_MODEL=${SARVAM_MODEL:-sarvam-105b-conversations}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:-}
    volumes:
      - backend_storage:/app/local_storage
      - ./synthetic_data:/app/synthetic_data:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend App ──
  frontend:
    build:
      context: ./Frontend/Trinetra-Intelligent-credit/Trinetra-Intelligent-credit
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: trinetra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── AI Agents (Building from shared Dockerfile) ──
  compliance-agent:
    build:
      context: ./agents
      dockerfile: Dockerfile
    image: trinetra-agent:latest
    container_name: agent-compliance
    command: python compliance-agent/main.py
    environment: &agent-env
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:8000
      - QDRANT_URL=http://qdrant:6333
      - VECTORAI_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/trinetra
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_MODEL=${SARVAM_MODEL:-sarvam-105b-conversations}
      - SUREPASS_API_KEY=${SUREPASS_API_KEY:-}
      - SUREPASS_BASE_URL=https://kyc-api.surepass.io/api/v1
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    deploy: &agent-deploy
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  doc-agent:
    image: trinetra-agent:latest
    container_name: agent-doc
    command: python doc-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  pd-agent:
    image: trinetra-agent:latest
    container_name: agent-pd
    command: python pd-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  gst-agent:
    image: trinetra-agent:latest
    container_name: agent-gst
    command: python gst-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  bank-recon-agent:
    image: trinetra-agent:latest
    container_name: agent-bank-recon
    command: python bank-recon-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  mca-agent:
    image: trinetra-agent:latest
    container_name: agent-mca
    command: python mca-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  web-agent:
    image: trinetra-agent:latest
    container_name: agent-web
    command: python web-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  model-selector-agent:
    image: trinetra-agent:latest
    container_name: agent-model-selector
    command: python model-selector-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  risk-agent:
    image: trinetra-agent:latest
    container_name: agent-risk
    command: python risk-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  bias-agent:
    image: trinetra-agent:latest
    container_name: agent-bias
    command: python bias-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  stress-agent:
    image: trinetra-agent:latest
    container_name: agent-stress
    command: python stress-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  cam-agent:
    image: trinetra-agent:latest
    container_name: agent-cam
    command: python cam-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    volumes:
      - ./agents/cam-agent/trinetra_cam_template.docx:/app/cam-agent/trinetra_cam_template.docx:ro
    depends_on: [compliance-agent]
    restart: unless-stopped

  monitor-agent:
    image: trinetra-agent:latest
    container_name: agent-monitor
    command: python monitor-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

  pan-agent:
    image: trinetra-agent:latest
    container_name: agent-pan
    command: python pan-agent/main.py
    environment: *agent-env
    deploy: *agent-deploy
    depends_on: [compliance-agent]
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  pg_data:
  backend_storage:
