# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path-list to be prepended to sys.path in env.py;
# default is value of not set.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to write to changelog
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow systems to find plugins in the
# local directory
# version_locations = %(here)s/bar

# version path separator; defaults to 'os.pathsep'
# version_path_separator = :

# set to 'true' to search for newer versions of migration files
# recursively
# recursive_version_check = false

# the output encoding used when writing new migration files
# output_encoding = utf-8

# sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/trinetra

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
