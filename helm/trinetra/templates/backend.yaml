apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trinetra.fullname" . }}-backend
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: REDIS_URL
              value: "redis://{{ include "trinetra.fullname" . }}-redis:6379"
            - name: DB_TYPE
              value: "postgres"
            - name: POSTGRES_HOST
              value: "{{ include "trinetra.fullname" . }}-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: QDRANT_HOST
              value: "{{ include "trinetra.fullname" . }}-qdrant"
            - name: QDRANT_PORT
              value: "6333"
            - name: OLLAMA_HOST
              value: "http://{{ include "trinetra.fullname" . }}-ollama:11434"
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trinetra.fullname" . }}-backend
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      name: http
  selector:
    app: backend
---
{{- if .Values.backend.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trinetra.fullname" . }}-backend
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "trinetra.fullname" . }}-backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetMemoryUtilizationPercentage }}
{{- end }}
