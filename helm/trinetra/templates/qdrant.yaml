apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "trinetra.fullname" . }}-qdrant-pvc
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.qdrant.persistence.size | quote }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "trinetra.fullname" . }}-qdrant
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "trinetra.fullname" . }}-qdrant
  replicas: {{ .Values.qdrant.replicaCount }}
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: {{ include "trinetra.fullname" . }}-qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trinetra.fullname" . }}-qdrant
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
spec:
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
  selector:
    app: qdrant
